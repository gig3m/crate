[package]
name = "crate"
version = "0.1.0"
edition = "2024"

[lib]
# `crate` is a Rust keyword, so the library (audio engine) needs its own name.
name = "crate_audio"
path = "src/lib.rs"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui-component = "0.9.1"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12" }
gpui_linux = { package = "gpui-pre-linux", version = "=0.3.12", features = ["wayland", "x11"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
env_logger = "0.11"
log = "0.4"
pipewire = { version = "0.10.1", features = ["v0_3_49"] }
symphonia = { version = "0.6.1", features = ["flac", "alac", "isomp4", "mp3", "aac"] }
rtrb = "0.4.1"
mpris-server = { version = "0.11.0", features = ["tokio"] }
