name: Release

# Push a tag like v0.1.0 to build the x86_64 Linux binary and publish a
# release; install.sh downloads the latest one.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpipewire-0.3-dev libopus-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libx11-xcb-dev libwayland-dev libfontconfig-dev libfreetype-dev \
            libvulkan-dev clang cmake pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check the tag matches Cargo.toml
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but Cargo.toml says $v"; exit 1; }
      - name: Tests
        run: cargo test --release
      - name: Build
        run: cargo build --release --bin crate-player
      - name: Package
        run: |
          mkdir dist
          cp target/release/crate-player dist/
          strip dist/crate-player
          cp assets/crate.svg dist/crate-player.svg
          cp packaging/crate-player.desktop dist/
          cp LICENSE README.md dist/
          tar -C dist -czf crate-player-x86_64-linux.tar.gz .
          sha256sum crate-player-x86_64-linux.tar.gz > crate-player-x86_64-linux.tar.gz.sha256
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            crate-player-x86_64-linux.tar.gz crate-player-x86_64-linux.tar.gz.sha256 \
            --title "Crate $GITHUB_REF_NAME" --generate-notes
